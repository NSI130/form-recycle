<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirim Kreasi Kamu</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: transparent;
      padding: 20px 10px;
      color: #1a202c;
      margin: 0;
      display: flex;
      justify-content: center;
    }

    form {
      background: #FDF9F1;
      padding: 30px;
      border: 2px solid #1c1c1c;
      border-radius: 16px;
      box-shadow: 6px 6px 0px #1c1c1c;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }

    h3 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: #2b3929;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
      color: #1c1c1c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;
      border: 2px solid #1c1c1c;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      background-color: #ffffff;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      background-color: #F0F6E9;
      box-shadow: 3px 3px 0px #1c1c1c;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 24px;
      font-size: 13px;
      background: #ffffff;
      border: 2px dashed #1c1c1c;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    button {
      background: #1c1c1c;
      color: #FDF9F1;
      padding: 14px;
      border: 2px solid #1c1c1c;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #E8B4B8;
      color: #1c1c1c;
      box-shadow: 4px 4px 0px #1c1c1c;
      transform: translate(-2px, -2px);
    }

    button:active {
      box-shadow: 0px 0px 0px #1c1c1c;
      transform: translate(2px, 2px);
    }

    .loading {
      display: none;
      text-align: center;
      font-weight: 500;
      color: #1c1c1c;
      font-size: 14px;
      margin-top: 15px;
      background: #E8B4B8;
      padding: 10px;
      border: 2px solid #1c1c1c;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <form id="myForm">
    <h3>Upload Your Creation</h3>
    
    <label>✦ Nama Pembuat</label>
    <input type="text" name="nama" placeholder="Masukkan nama kamu..." required>

    <label>✦ Judul Kreasi</label>
    <input type="text" name="judul" placeholder="Contoh: Gantungan Kunci..." required>

    <label>✦ Bahan yang kamu gunakan</label>
    <input type="text" name="bahan" placeholder="Botol plastik, kardus..." required>

    <label>✦ Cerita di Balik Karyamu</label>
    <textarea name="cerita" rows="3" placeholder="Ceritakan proses pembuatannya ya aku penasaran..." required></textarea>

    <label>✦ Pilih Foto (Maks 10MB)</label>
    <input type="file" name="foto" accept="image/*" required>

    <button type="submit" id="submitBtn">Kirim Karyamu</button>
    <p class="loading" id="loadingText">⏳ Sedang mengunggah karya......</p>
  </form>

  <script>
    document.getElementById('myForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var loading = document.getElementById('loadingText');
      var form = this;
      
      btn.style.display = 'none';
      loading.style.display = 'block';

      var fileInput = form.querySelector('input[type="file"]');
      var file = fileInput.files[0];

      var reader = new FileReader();
      reader.onload = function(event) {
        var base64Data = event.target.result.split(',')[1];
        
        var params = new URLSearchParams();
        params.append('nama', form.nama.value);
        params.append('judul', form.judul.value);
        params.append('bahan', form.bahan.value);
        params.append('cerita', form.cerita.value);
        params.append('fileData', base64Data);
        params.append('fileName', file.name);
        params.append('mimeType', file.type);

        fetch('https://script.google.com/macros/s/AKfycbzynPK7o-ElDmZj87rVzWrBFl7UpfU0VH5c21CNjxtDUs1_J62N9cNuynHu-RiyjR7NLA/exec', {
          method: 'POST',
          body: params
        })
        .then(response => response.json())
        .then(data => {
          if(data.result === 'success') {
            alert('Yeay! Kreasi berhasil dikirim dan tersimpan di Galeri REBLOOM.');
            form.reset();
          } else {
            alert('Gagal dari server: ' + data.message);
          }
          btn.style.display = 'block';
          loading.style.display = 'none';
        })
        .catch(error => {
          alert('Terjadi kesalahan koneksi, silahkan coba lagi.');
          console.error('Error:', error);
          btn.style.display = 'block';
          loading.style.display = 'none';
        });
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
